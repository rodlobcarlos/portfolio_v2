name: Reflex deploy

on:
  push:
    branches: [ 'main' ]
  
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  packages: write
  contents: read
  
jobs:
  # Reflex build and deploy
  build_python:
    name: Build and deploy app
    runs-on: ubuntu-24.04

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.x'
          cache: 'pip'
          
      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependences
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Reflex
        run: reflex init

      - name: Compile validate
        run: reflex compile --dry

      - name: Reflex Cloud Deploy 
        if: github.ref == 'refs/heads/main'
        env:
          REFLEX_AUTH_TOKEN: ${{ secrets.REFLEX_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          reflex deploy --app-name "portfolio_v2" --project "7e1e10a4-9331-4418-a122-c73c9d70b3fa" --no-interactive --loglevel debug 2>&1 | tee deploy.log

  # Docker image build and push to GHCR
  docker_image:
    name: Push docker image
    runs-on: ubuntu-24.04      
    needs: build_python
    
    steps: 
        - name: Download code
          uses: actions/checkout@v4

        - name: Set up Docker buildx
          uses: docker/setup-buildx-action@v3

        - name: Log in to GitHub Container Registry (GHCR)
          if: github.event_name == 'push'
          uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Extract metadata (lags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          with: 
            images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            tags: |
              type=sha,prefix=,format=short
              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

        - name: Push Docker Images to GHCR
          if: github.event_name == 'push'
          uses: docker/build-push-action@v6
          with: 
            context: .
            file: portfolio_v2/Dockerfile
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
